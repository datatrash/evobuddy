name: Checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assemblePreview :app:assembleRelease
      - name: Check release metadata and site
        run: python3 tools/check-release.py
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/check-release.py --expected-tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evobuddy-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

  fdroid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install metadata tools
        run: |
          python3 -m venv /tmp/fdroid-tools
          /tmp/fdroid-tools/bin/pip install fdroidserver==2.4.5
      - name: Check F-Droid metadata
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://gitlab.com/fdroid/fdroiddata.git /tmp/fdroiddata
          git -C /tmp/fdroiddata sparse-checkout set config
          mkdir -p /tmp/fdroiddata/metadata
          cp fdroid/metadata/sh.datatra.evobuddy.yml /tmp/fdroiddata/metadata/
          chmod 600 /tmp/fdroiddata/config.yml
          cd /tmp/fdroiddata
          /tmp/fdroid-tools/bin/fdroid lint sh.datatra.evobuddy
